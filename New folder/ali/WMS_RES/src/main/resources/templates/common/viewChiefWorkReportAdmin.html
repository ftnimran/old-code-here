	function fetchChiefWorkList() {

					                return typeof i === 'string' ?
					                    i.replace(/[\$,]/g, '')*1 :
					                    typeof i === 'number' ?
					                        i : 0;
					            };
							
							// computing column Total of the complete result

				                .column( 2 )

				                    return intVal(a) + intVal(b);
				                }, 0 );

				                .column( 3 )

				                }, 0 );

			                .reduce( function (a, b) {
			                    return intVal(a) + intVal(b);
			                }, 0 );
