<!DOCTYPE html>

<script type="text/javascript">


function fwdForPayment(billId){

}

function rejectBillLoad(billId){

}

	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchWorksByName() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							"bDestroy": true,
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Work_data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4, 5, 6 ]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "searchBoxVal",
									"value" : $('#searchBox').val()
								});
								
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								
								var loggedInUserRole = $("#loggedInUserRole").val();
								
								if(aData.addNewBillShow) {
								$('td:eq(7)', nRow)
								.html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View" href="#addNewBill/'+aData.workId+'">Add New Bill</i></a>');
								}
								else{
									$('td:eq(7)', nRow)
									.html('<a  "></i></a>');
									}
								
								/* if(loggedInUserRole=='ROLE_EE'){
								$('td:eq(7)', nRow)
								.append(
										'<a class="btn btn-xs btn-success" data-toggle="tooltip" data-placement="top" title="Allow Sub Eng To Prepare Extra Amount OF Bill" onclick="return allowSubEngToPrepareBill('
												+ aData.workId
												+ ');" href=""><i class="fa fa-check-square"></i></a> ');
							} */
								 
								
								
								
								
								
								
     						
										
							  },
							
							
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								/* $('td:eq(0)', nRow)
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchWorksByName",

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							}, {
								
								"data" : "workName",
								"bSortable" : false
							}, {
								"data" : "workRequisitionNo",
								"bSortable" : false
							}, {
								"data" : "workTypeBean.workTypeNameE",
								"bSortable" : false
							},
							{
								"data" : "workSubTypeBean.workSubTypeNameE",
								"bSortable" : false,
								mRender: function (data, type, row) {
			  	            		var workSubTypeName=row.workSubTypeBean.workSubTypeNameE;
			  	            		if(null== workSubTypeName){
			  	            			workSubTypeName="-";
			  	            		}
			  	            		return workSubTypeName; 
			  	            	}
							},
							{
								"data" : "agencyTypeBean.agencyTypeNameE",
								"bSortable" : false
							},
							{
								"data" : "villageBean.villageName",
								"bSortable" : false,
								mRender: function (data, type, row) {
			  	            		var village=row.villageBean.villageName;
			  	            		if(null== village){
			  	            			village="-";
			  	            		}
			  	            		return village; 
			  	            	}
							}, {
								"data" : null,
								"bSortable" : false
							} ],

						});
	}
	
	function allowSubEngToPrepareBill(workId) {
		/* alert(workId); */

		/* return angular.element(document.getElementById('CommonController')).scope()
				.deleteInward(id); */
			return $('#page-div').scope().allowSubEngToPrepareBill(workId);
	}
	
	function deleteBill(id) {

		return $('#page-div').scope().deleteBill(id);
	}
	
	function reDraw() {
		t.draw();
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	/* $('#applyFilters').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
		$('#searchForm').submit();
	}); */
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});
	$(function() {
		
		$('#datetimepicker1').datetimepicker({
			//viewMode : 'days',
			//useCurrent: false,
			maxDate : moment(),
			format : 'DD/MM/YYYY'
		});
		
		$('#datetimepicker2').datetimepicker({
			//viewMode : 'days',
			//useCurrent: false,
			maxDate : moment(),
			format : 'DD/MM/YYYY'
		});
		
		$("#datetimepicker1").on("change.datetimepicker", function (e) {
	        $('#datetimepicker2').datetimepicker('minDate', e.date);
        });
        $("#datetimepicker2").on("change.datetimepicker", function (e) {
            $('#datetimepicker1').datetimepicker('maxDate', e.date);
        });
	});

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
<div style = "display: none">
			<input type="text" th:value="${loggedInUserRole}" 
							name="loggedInUserRole" id="loggedInUserRole" disabled="disabled"/>
			</div>
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span th:text="#{addNewBill}">addNewBill</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadWorksForBillingP()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span
								th:text="#{addNewBill}">addNewBill</span>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
							<div class="pr">
								<form name="searchForm" novalidate="novalidate"
									data-ng-submit="searchByWorkName()">
									<div class="row">
										<div class="input-group mb-3 col-md-6 filter-box">
											<input type="text" class="form-control" id="searchBox"
												placeholder="Search by Work Name."
												data-ng-model="searchBox" maxlength="30" />
											<div class="btn-group pr">
												<button class="btn btn-secondary" type="submit"
													title="Search">
													<i class="fa fa-search"></i>
												</button>
												<button class="btn btn-secondary" type="reset"
													data-ng-click="resetFunction()" title="Reset">
													<i class="fa fa-refresh"></i>
												</button>
											</div>
										</div>
									</div>
								</form>
							</div>
							<div class="table-responsive">
								<table id="dynamic-table"
									class="table table-striped table-bordered table-hover table-outline">
									<thead class="thead-default">
										<tr>
											<th><span>#</span></th>
											
											<th width="25%"><span th:text="#{workName}">Work Name</span></th>
											<th width="15%">  Work Requisition No </th>
											<th  width="15%"><span th:text="#{workType}">Work Type</span></th>
											<th  width="10%"><span th:text="#{workSubType}">workSubType</span></th>
											<th  width="10%"><span th:text="#{executionAgency}">executionAgency</span></th>
											<th  width="10%"><span th:text="#{village}">village</span></th>
											<th width="10%"><span th:text="#{action}">Action</span></th>
										</tr>
									</thead>
								</table>
								<!-- <div align="center">
								<a class="btn btn-secondary" href="#searchWorkForBill">
									<span th:text="#{addNewBill}">Add New Bill</span>
								</a>
								</div> -->
								
								
		 <div class="modal fade popup-lg" tabindex="-1" role="dialog"
			aria-labelledby="myLargeModalLabel" aria-hidden="true"
			id="remark-popup">
			<div class="modal-dialog modal-lg modal-map" style="max-width:50%;margin-top:15%;">
				<div class="modal-content">
					<div class="modal-header">
						<h6 class="modal-title">
							<span>Remark </span>
						</h6>
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="col-md-12" style="margin-top:20px;">
						<form data-ng-submit="rejectBill1(form, form.$valid)"
							name="form" novalidate="novalidate">
							<input type="hidden" id="id" data-ng-model="billBean.id" name="id"/>
							<div class="row">							
								<div class="form-group col-sm-6">
									<label><span>Remark</span> <span class="aestrick">&#42;</span></label> 
									<input class="form-control" required="required" id="remark"
										data-ng-model="billBean.remark"
										name="remark" type="text" maxlength="90" />
									<div data-ng-show="form.$submitted">
										<p class="help-block" style="color: red;"
											data-ng-show="form.remark.$error.required">
											<span th:text="#{pleaseEnter}">Please enter</span> <span th:text="#{remark}"> remark.</span>
										</p>
									</div>
								</div>		
								 	<div class="form-group col-sm-6"> </div>
								<div class="form-group col-sm-12">
									<div class="text-right">
										 
										<button type="submit" class="btn btn-sm btn-success">
											<span th:text="#{submit}">Submit</span>
										</button>												
									</div>	
								</div>
							</div>
						</form>
					</div>					
				</div>
			</div>
		</div>		
								
								
								
								
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
