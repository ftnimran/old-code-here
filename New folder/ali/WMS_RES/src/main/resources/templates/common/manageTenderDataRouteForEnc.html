<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchWorkTender() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Work_data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4, 5, 6 ]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "searchBoxVal",
									"value" : $('#searchBox').val()
								});
								aoData.push({
									"name" : "billDateFrom",
									"value" : $('#billDateFrom').val()
								});
								aoData.push({
									"name" : "billDateTo",
									"value" : $('#billDateTo').val()
								});
								aoData.push({
									"name" : "status",
									"value" : $('#status').val()
								});
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								
								if(aData.tenderStatusId==1){						
								$('td:eq(8)', nRow)
								.html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="edit" href="#editTender/'+aData.workId+'/'+aData.administrationSanctionId+'"><i class="fa fa-pencil"></i></a>');
								}
								else if(aData.tenderStatusId==null){		
								
								$('td:eq(8)', nRow)
								.html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="Generate" href="#addTender/'+aData.workId+'/'+aData.administrationSanctionId+'"><i class="fa fa-plus"></a>');
								}
								else if(aData.tenderStatusId==2){
								  
								$('td:eq(8)', nRow)
								.html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View" href="#viewTender/'+aData.workId+'/'+aData.administrationSanctionId+'"><i class="fa fa-eye"></i></a>');
								}
								    
								//Rakesh
								if(aData.tenderParentId!=null){
									//alert('parent -'+aData.tenderParentId);
									/* $('td:eq(8)', nRow)
									.html('REVISED'); */
									
									$('td:eq(8)', nRow).append(' <a class="btn btn-xs btn-warning" data-toggle="tooltip" data-placement="top" title="View History" href="#manageHistoryTenderDataRoute/'+aData.workId+'/'+aData.administrationSanctionId+'"><i class="fa fa-eye"></i></a>');
								}
							},
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								/* $('td:eq(0)', nRow)s
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchWorkTender",
							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							},
							{
								"data" : "workName"
							}, 
							{
								"data" : "workRequisitionNo"
							}, 
							{
								"data" : "agencyName"
							}, 
							{
								"mData" : null,
								"bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		var tenderCost=row.tenderCost;
			  	            		if(null== tenderCost){
			  	            			tenderCost="-";
			  	            		}
			  	            		return tenderCost; 
			  	            	}
							},
							  
							{
								"mData" : null,
								"bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		var bidderName=row.bidderName;
			  	            		if(null== bidderName){
			  	            			bidderName="-";
			  	            		}
			  	            		return bidderName; 
			  	            	}
							},
							
							
							{

								"mData" : null,
								"bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		var tenderStatus=row.tenderStatus;
			  	            		if(null== tenderStatus){
			  	            			tenderStatus="-";
			  	            		}
			  	            		return tenderStatus; 
			  	            	}
							},
							{
								"mData" : null,
								"bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		var workStatus=row.workStatus;
			  	            		if(null== workStatus){
			  	            			workStatus="-";
			  	            		}
			  	            		return workStatus; 
			  	            	}
							},
							{
								"data" : null,
								"bSortable" : false
							} ],
							
							

						});
	}
	
	
 
	
	function reDraw() {
		t.draw();
	}

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span>Tender List</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadWorkTender()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span
								>Tender List</span>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
							
							<div class="table-responsive">
								<table id="dynamic-table"
									class="table table-striped table-bordered table-hover table-outline">
									<thead class="thead-default">
										<tr>
											<th><span>#</span></th>
											<th><span>Work Name</span></th>
												<th><span>Work Requisition No</span></th>
											<th><span>Execution Agency</span></th>
											<th><span>Tender Cost</span></th>
											<th><span>Successful Bidder</span></th>
											
											<th><span>Tender Status</span></th>
											<th><span>Work Status</span></th>
											<th width="10%"><span th:text="#{action}">Action</span></th>
										</tr>
									</thead>
								</table>
								
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
