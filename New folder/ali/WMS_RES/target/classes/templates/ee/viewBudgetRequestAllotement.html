<!DOCTYPE html>

</head>

	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	var amt = 0;

							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",

							/* "dom" : 'Blrtip', */

							"buttons" : [

							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
							
							},
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								//$("#accHead").html(aData.accountHead);
								//$("#recOn").html(aData.receivedOn);
								//$("#amt").html(aData.receivedAmount);
								/* $('td:eq(0)', nRow)
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchBudgetRequestAllotementList/"+id,

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							},							
							{
								
								"data" : "officeName",
								"bSortable" : false
							}, 
							{
								"data" : "amount",
								"bSortable" : false
							}, 
							{
								"data" : "eeOfficeAmountReceivedOn",
								"bSortable" : false
							}
							  ],
							 

						});
	}
	
	function deleteWork(id) {

		/* return angular.element(document.getElementById('CommonController')).scope()
				.deleteInward(id); */
			return $('#page-div').scope().deleteWork(id);
	}
	function reDraw() {
		t.draw();
	}
	
	function toggleFields(index) {
		
		if($('input[name^="selectbox"]')[index].checked == true ) {
			$('input[name^="requestedAmount"]')[index].removeAttribute("disabled");	
			$('input[name^="contingency"]')[index].removeAttribute("disabled");
			
		}
		else {
			$('input[name^="requestedAmount"]')[index].setAttribute("disabled", "disabled");
			
			$('input[name^="contingency"]')[index].setAttribute("disabled", "disabled");
			
		}
		
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	/* $('#applyFilters').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
		$('#searchForm').submit();
	}); */
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span
			th:text="#{viewBudgetAllotmentList}">Manage Legacy Data</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>

	<input type="hidden" th:value="${workStatus}" id="workStatus" /> <input
		type="hidden" th:value="${isLegacy}" id="isLegacy" />

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadBudgetRequestAllotementList()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span
								th:text="#{viewBudgetAllotmentList}">Manage Legacy Data</span>
						</div>
						
						<div class="card-body">
								<table style="width: 100%;">
									<tr>
										<td width="33.33%"><span style="font-weight: 700;">Account Head : </span> {{budgetAllotmentBean.accountHead}}</td>
										<td width="33.33%"><span style="font-weight: 700;">Received On : </span> {{budgetAllotmentBean.receivedOn}}</td>
										<td width="33.33%"><span style="font-weight: 700;">Amount Received  : </span>{{budgetAllotmentBean.amount}}</td>
									</tr>
									 
								</table>
							</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>

							 
							<div class="table-responsive">
								<form name="budgetRequestForm" novalidate="novalidate" id="searchForm" data-ng-submit="saveEditBudgetRequest(budgetRequestForm.$valid)">
									<table id="dynamic-table"
										class="table table-striped table-bordered table-hover table-outline">
										<thead class="thead-default">
											<tr>
											<th><span>#</span></th>
											
											<th><span th:text="#{officeName}">Office Name</span></th>
											
											<th><span>Amount Allocated</span></th>
											
											<th><span >Allocated On</span></th>
											
										</tr>
										</thead>
									</table>								
									 
								</form>
							</div>
							

						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
