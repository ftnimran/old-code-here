<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>

<style>
#dynamic-table input[type="text"] {width: 100%;box-sizing: border-box;-webkit-box-sizing:border-box;-moz-box-sizing: border-box;min-height: initial;}
</style>

</head>

<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchBudgetRequestApprovalList() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Work_data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4, 5, 6, 7, 8]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "searchBoxVal",
									"value" : $('#searchBox').val()
								});
								aoData.push({
									"name" : "status",
									"value" : $('#status').val()
								});
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								
								$('td:eq(9)', nRow).html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View" href="#viewBudgetRequest/'+aData.id+'"><i class="fa fa-eye"></i></a>');
								
								if(aData.statusId == 3) {
									$('td:eq(9)', nRow).append('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="Edit" href="#editBudgetRequestApproval/'+aData.id+'"><i class="fa fa-pencil"></i></a>');	
								}
								
								if(aData.statusId == 2) {
								     $('td:eq(9)', nRow) .append('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="Add" href="#budgetRequestApproval/'+aData.id+'"><i class="fa fa-plus"></i></a>');
								}
								 
							},
							
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								/* $('td:eq(0)', nRow)
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchBudgetRequestApprovalList",

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							},
							{
								"data" : "requestNumber"
							}, 
							{
								"data" : "requestDate"
							},
							{
								"data" : "noOfWork"
							},
							{
								"data" : "requestedAmount"
							},
							{
								"mData" : null,
								"bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		var approvedAmount = row.approvedAmount;
			  	            		if(null== approvedAmount){
			  	            			approvedAmount="-";
			  	            		}
			  	            		return approvedAmount; 
			  	            	}
							},
							{
								"data" : "accountHeadNameE"
							},
							{
								"data" : "officeName"
							}, 
							{
								"data" : "status"
							}, 
							{
								"data" : null,
								"bSortable" : false
							} ],

						});
	}
	
	function reDraw() {
		t.draw();
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	/* $('#applyFilters').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
		$('#searchForm').submit();
	}); */
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span th:text="#{Budget_Request}">Budget Request</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadBudgetRequestApprovalList()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span
								th:text="#{Budget_Request}">Budget Request</span>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
						 
							<div class="table-responsive">
								<form name="budgetRequestForm" novalidate="novalidate" id="searchForm" data-ng-submit="saveBudgetRequestApproval(budgetRequestForm.$valid)">
									<table id="dynamic-table"
										class="table table-striped table-bordered table-hover table-outline">
										<thead class="thead-default">
											<tr>
												<th width="5%"><span>#</span></th>
												<th width="10%"><span th:text="#{Request_No}">Request No</span></th>
												<th width="10%"><span th:text="#{Request_Date}">Request Date</span></th>
												<th width="5%"><span th:text="#{No_of_Works}">No. of Works</span></th>
												<th width="7%"><span th:text="#{Requested_Amount}">Request Amount</span></th>
												<th width="7%" ><span th:text="#{Approved_Amount}">  Approved Amount </span> </th>
												<th width="15%" ><span>Account Head</span> </th>
												<th  width="15%"><span th:text="#{officeName}">Office Name</span></th>
												<th  width="15%"><span th:text="#{status}">Status</span></th>
												<th width="15%"><span th:text="#{action}">Action</span></th>
											</tr>
										</thead>
									</table>								
									 
								</form>
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
