	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchWorkList() {

							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true"

											columns : [ 0, 1, 2, 3, 4, 5, 6 ]

							"lengthMenu" : [ [ 10, 25, 50, 100000 ],

							"fnDrawCallback" : function() {

								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);

									"name" : "searchBoxVal",

									"name" : "designation",

								aoData.push({
									"name" : "status",

								aoData.push({
									"name" : "workStatus",
									"value" : $('#workStatus').val()
								});
								aoData.push({
									"name" : "isLegacy",

								});

								aoData.push({
									"name" : "workTypeId",

								aoData.push({

								});

									"name" : "workLineDepartmentId",
									"value" : $('#workLineDepartmentId').val()

									"name": "selectionDropdownVal",

								aoData.push({
									"name" : "blockId",
									"value" : $('#blockId').val()
								});
								aoData.push({
									"name" : "gramPanchayatId",
									"value" : $('#gramPanchayatId').val()
								});
								aoData.push({
									"name" : "villageId",
									"value" : $('#villageId').val()
								});

								});

									"value" : $('#financialYearId').val()

							"fnCreatedRow" : function(nRow, aData, iDataIndex) {

								/* $('td:eq(14)', nRow)
										.html(
												(aData.workRequestStatusId == 1 ? '<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View/Edit" href="#editLegacyDataRoute/'+aData.workId+'"><i class="fa fa-pencil"></i></a>'
														: '<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View" href="#editLegacyDataRoute/'+aData.workId+'"><i class="fa fa-eye"></i></a>')); */
								$('td:eq(1)', nRow)
										.html(
												'<h5>' + '<strong>'
														+ ((aData.workRequisitionNo) ? aData.workRequisitionNo

														+ ((aData.workName) ? aData.workName

																: "")
														+ ((aData.totalExpenditureAmount) ? ("<b>Total Expenditure</b> : Rs. "
																+ aData.totalExpenditureAmount + " | ")
																: "")
														+ ((aData.workStatus) ? ("<b>Current Status</b> : "
																+ aData.workStatus + " | ")
																: "")
														+ ((aData.physicalStageType) ? ("<b>Current Stage</b> : " + aData.physicalStageType)
																: "")
														+ '</p>'
														+ '<p style="margin: 10px 0 8px 0px;">'
														+ ((aData.workAgreementBean) ? ((aData.workAgreementBean.writtenOrderDate) ? ("<b>W.O. Date</b> : "
																+ aData.workAgreementBean.writtenOrderDate + " | ")
																: "")
																: "")
														+ ((aData.workAgreementBean) ? ((aData.workAgreementBean.agreementNumber) ? ("<b>Agreement No.</b> : "
																+ aData.workAgreementBean.agreementNumber + " | ")
																: "")
																: "")
														+ ((aData.workAgreementBean) ? ((aData.workAgreementBean.agreementDate) ? ("<b>Agreement Date</b> : "
																+ aData.workAgreementBean.agreementDate + " | ")
																: "")
																: "")
														+ ((aData.workAgreementBean) ? ((aData.workAgreementBean.tentativeCompletionDate) ? ("<b>Stipulated Date of Completion</b> : " + aData.workAgreementBean.tentativeCompletionDate)
																: "")
																: "")
														+ '</p>'
														+ '<p style="margin: 10px 0 8px 0px;">'
														+ ((aData.lineDepartmentName) ? ("<b>Line Dept.</b> : "
																+ aData.lineDepartmentName + " | ")
																: "")
														+ ((aData.prevBillAmount) ? ("<b>Prev. Bill</b> : "
																+ aData.prevBillAmount + " | ")
																: "")
														+ ((aData.prevBillPaidAmount) ? ("<b>Prev. Bill Paid</b> : " + aData.prevBillPaidAmount)
																: "") + '</p>');

								$('td:eq(2)', nRow)
										.html(
												'<a class="btn btn-sm btn-primary" href="#cc/workDetails/'+aData.workId+'"> View Details</a>');
							},
							"fnRowCallback" : function(nRow, aData,

								/* $('td:eq(0)', nRow).html((this.fnPagingInfo().iPage * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

								"data" : "index",

							}, {
								"data" : null,
								"bSortable" : false
							}, {

								"bSortable" : false

	function deleteWork(id) {

		/* return angular.element(document.getElementById('CommonController')).scope()
				.deleteInward(id); */
		return $('#page-div').scope().deleteWork(id);
	}
	function reDraw() {
		t.draw();
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	/* $('#applyFilters').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
		$('#searchForm').submit();
	}); */
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});

	/*]]>*/
</script>
