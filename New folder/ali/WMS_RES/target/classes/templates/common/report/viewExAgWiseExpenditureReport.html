<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	
	
	
	
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchExAgWiseExpenditureList() {

		t = $("#dynamic-table")
				.DataTable(
						{
							
						"footerCallback": function ( row, data, start, end, display ) {
					            var api = this.api(), data;
					            // converting to interger to find total
						            var intVal = function ( i ) {
						                return typeof i === 'string' ?
						                    i.replace(/[\$,]/g, '')*1 :
						                    typeof i === 'number' ?
						                        i : 0;
						            };
								// computing column Total of the complete result 
					            var twoTotal = api
					                .column( 2 )
					                .data()
					                .reduce( function (a, b) {
					                    return intVal(a) + intVal(b);
					                }, 0 );
									
						    var threeTotal = api
					                .column( 3 )
					                .data()
					                .reduce( function (a, b) {
					                    return intVal(a) + intVal(b);
					                }, 0 );
					            // Update footer by showing the total with the reference of the column index 
						    	$( api.column( 1 ).footer() ).html('Total');
					            $( api.column( 2 ).footer() ).html(twoTotal);
					            $( api.column( 3 ).footer() ).html(threeTotal);
					             
					        },
							
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							 "bInfo" : false,
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							"paging":   false,
							 "ordering": false,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							// For Not Displaying 10 , 20, 50 , ALL Filter use below code 
							 /* "bLengthChange" : false, */
							"pagingType" : "full_numbers",
							"aaSorting" : [ ],
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Status Wise Work Report',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);
								var oSettings = this.fnSettings();
								var iTotalRecords = oSettings.fnRecordsTotal();
								$('#total').val(iTotalRecords)
							},
							
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								
								/* $('td:eq(3)', nRow)
								.html( (aData.agencyName)?aData.agencyName: "-"); */
								/* 
								$('td:eq(8)', nRow)
										.html( (aData.status == 'Active' ? '<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View/Edit" href="#editLegacyDataRoute/'+aData.workId+'"><i class="fa fa-pencil"></i></a>'
												: ""));
								$('td:eq(8)', nRow)
								.append(
										(aData.status == 'Active' ? 	'<a class="btn btn-xs btn-danger" data-toggle="tooltip" data-placement="top" title="Delete" onclick="return deleteWork('
												+ aData.workId
												+ ');" href=""><i class="fa fa-trash-o"></i></a> ' : "")); */
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "financialYearId",
									"value" : $("#financialYearId option:selected").html()
								});
								
								aoData.push( { 
									"name": "executionAgencyId", 
									"value": $('#executionAgencyId').val()});
								
								aoData.push( { 
									"name": "districtId", 
									//"value": $('#distStr').val()});
									"value": getValue()});
		
								aoData.push( { 
									"name": "workTypeId", 
									"value": $('#workTypeId').val()});
								
								aoData.push( { 
									"name": "workSubTypeId", 
									//"value": $('#distStr').val()});
									"value": getWSubTalue()});
		
							},
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								
								$('td:eq(1)', nRow).html('<a class="blue"  href="#viewEeWiseExpenditureReport/'+aData.name+' " >' + aData.name + '</a>');
								
								
								$('td:eq(0)', nRow).html((this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); 
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchExAgWiseExpenditureList",

							"columns" : [ 
							
							{
								"data" : null,
								"bSortable" : false
							}, {
								"data" : "name"
							},{
								"data" : "count1"
							},{
								"data" : "count2"
								}],

						});
	}
	
	function deleteWork(id) {

		/* return angular.element(document.getElementById('CommonController')).scope()
				.deleteInward(id); */
			return $('#page-div').scope().deleteWork(id);
	}
	function reDraw() {
		t.draw();
	}
function getValue(){
	//alert('get VAlue='+$('#districtId').val());
	return $('#districtId').val()+"";
}

function getWSubTalue(){
	//alert('get VAlue='+$('#districtId').val());
	return $('#workSubTypeId').val()+"";
}
	

	/*]]>*/
</script>

												data-ng-change="reloadJqueryDatatable();"
												name="financialYearName">
												<option value="" disabled="disabled">--- Select Financial Year ---</option>
												<option
													data-ng-repeat="financialYear in financialYears"
													value="{{financialYear.financialYearId}}">{{financialYear.financialYearNameE}}</option>
											</select>
													</div>
													
													
													<div class="form-group col-md-2" style="padding:30px">
													<label><span >District</span></label> 
										      <select

												data-ng-model="districtId" 
												data-ng-init="loadDistrictsOfMPNew();"
												data-ng-change="reloadJqueryDatatable();"
												name="districtName">
												<option
													data-ng-repeat="district in districtsMP"
													value="{{district.districtId}}">{{district.districtName}}</option>
											 </select>
										</div> 
										
										<div class="form-group col-md-2">
										<label><span >Work Type</span></label>
										<br/> 		
												<select
												class="form-control"  id="workTypeId"
												data-ng-model="workData.workTypeId"
												data-ng-init="loadWorkType();" 
												
												data-ng-change="loadWorkSubTypeByWorkTypeId(workData.workTypeId);reloadJqueryDatatable();"
												name="districtName">
												<option value="" disabled="disabled">--Select Work Type--</option>
												<option
													data-ng-repeat="workType in workTypes"
													value="{{workType.workTypeId}}">{{workType.workTypeNameE}}</option>
											</select>
												</div>
												
											<div class="form-group col-md-2" style="padding:30px">
											<label><span >Work Sub Type</span></label>		
												 <select
												class="multiselect" multiple="multiple" id="workSubTypeId"
												data-ng-model="workData.workSubTypeId"
												data-ng-change="reloadJqueryDatatable();"
												name="workSubTypeName">
												<option value="" disabled="disabled">--Select Work SubType--</option>
												<option
													data-ng-repeat="workSubType in workSubTypes | orderBy : 'workSubTypeNameE'"
													value="{{workSubType.workSubTypeId}}">{{workSubType.workSubTypeNameE}}</option>
											</select>
												</div>
