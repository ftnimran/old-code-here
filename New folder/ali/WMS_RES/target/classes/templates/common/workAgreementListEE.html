<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchWorkAgreementList() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Work_data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4, 5, 6 ]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "searchBoxVal",
									"value" : $('#searchBox').val()
								});
								aoData.push({
									"name" : "billDateFrom",
									"value" : $('#billDateFrom').val()
								});
								aoData.push({
									"name" : "billDateTo",
									"value" : $('#billDateTo').val()
								});
								aoData.push({
									"name" : "status",
									"value" : $('#status').val()
								});
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {

								if(aData.workAgreementStatusId == null){
									$('td:eq(9)', nRow)
									.html('<a class="btn btn-xs btn-success" data-toggle="tooltip" data-placement="top" title="Add Work Agreement" href="#addWorkAgreement/'+aData.workId+'"><i class="fa fa-plus"></i></a>');
								} else if (aData.workAgreementStatusId == 1) {
									$('td:eq(9)', nRow)
									.html('<a class="btn btn-xs btn-warning" data-toggle="tooltip" data-placement="top" title="Edit Work Agreement" href="#editWorkAgreement/'+aData.workId+'"><i class="fa fa-pencil"></i></a>');	
								} else if (aData.workAgreementStatusId == 2) {
									$('td:eq(9)', nRow)
									.html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View Work Agreement" href="#viewWorkAgreement/'+aData.workId+'"><i class="fa fa-eye"></i></a>');	
								}
								if(aData.parentId!=null){
									$('td:eq(9)', nRow).append(' <a class="btn btn-xs btn-danger" data-toggle="tooltip" data-placement="top" title="View History" href="#workAgreementHistoryList/'+aData.workId+'/'+aData.tenderId+'"><i class="fa fa-eye"></i></a>');
								}
							},
							
							"fnRowCallback" : function(nRow, aData,	iDisplayIndex, iDisplayIndexFull) {
								 
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchWorkAgreementList",  // "fetchPendingWorkEstimations",

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							},							
							{
								"data" : "workRequisitionNo"
							}, 
							{
								"data" : "workName"
							}, 
							{
								"data" : "executionAgency",
								"bSortable" : false
							},							
							{ 	"data": "tenderCost", "bSortable": false,
				            	mRender: function (data, type, row) {
				            		return (row.tenderCost!=null)?row.tenderCost:"--";
				            	}
				            },
				            { 	"data": "contractorName", "bSortable": false,
				            	mRender: function (data, type, row) {
				            		return (row.contractorName!=null)?row.contractorName:"--"; 
				            	}
				            },
				            { 	"data": "agreementDate", "bSortable": false,
				            	mRender: function (data, type, row) {
				            		return (row.agreementDate!=null)?row.agreementDate:"--"; 
				            	}
				            },				            
				            { 	"data": "tentativeCompletionDate", "bSortable": false,
				            	mRender: function (data, type, row) {
				            		return (row.tentativeCompletionDate!=null)?row.tentativeCompletionDate:"--"; 
				            	}
				            },
							{	"data" : null, "bSortable" : false, 
			  	            	mRender: function (data, type, row) {
			  	            		return (row.workAgreementStatus!=null)?row.workAgreementStatus:"--";
			  	            	}
							},
							{	"data" : null,
								"bSortable" : false
							} ],

						});
	}
	
	function deleteBill(id) {

		return $('#page-div').scope().deleteBill(id);
	}
	
	function reDraw() {
		t.draw();
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span>View Work Agreement
				List</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadWorkAgreementList()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span>View Work Agreement List</span>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>

							<div class="table-responsive">
								<table id="dynamic-table"
									class="table table-striped table-bordered table-hover table-outline">
									<thead class="thead-default">
										<tr>
											<th><span>#</span></th>
											<th><span>Work Id</span></th>
											<th><span>Work Name</span></th>
											<th><span>Execution Agency</span></th>
											<th><span>Tender Cost</span></th>
											<th><span>Successful Builder</span></th>
											<th><span>Agreement Date</span></th>
											<th><span>Stipulated Completion Date</span></th>											
											<th><span>Status</span></th>
											<th width="8%"><span>Action</span></th>
										</tr>
									</thead>
								</table>

							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
