<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<div th:fragment="entrepreneurPopupScript">
	<script type="text/javascript">
	
		$('input.typeahead').typeahead({
		    source:  function (query, process) {
	        return $.get('/mplwb-contribution-app/fetchParentAcctNames', { query: query }, function (data) {
		            return process(data);
		        });
		    }
		});
		$(function() {

			$('#datetimepicker2').datetimepicker({
				maxDate : moment(),
				 
				viewMode : 'months',
				format : 'MM/YYYY'
			});
			 
		});
	</script>
</div>
<div>
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item"><a href="#manageallbanks"><span
				th:text="#{manageBanks}">Manage Bank</span></a></li>
		<li class="breadcrumb-item active"><span
			th:text="#{editBank}">Edit Bank</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="#" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadBanksDetail()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span th:text="#{editBank}">Add
								Bank</span>
						</div>

						<form data-ng-submit="editBank(bankForm, bankForm.$valid)"
							name="bankForm" id="bankForm"
							novalidate="novalidate">
							<div th:fragment="bankPopup">
								<!-- <div class="card-header">
									<span th:text="#{editBank}">Bank
										Details</span>
								</div> -->
								<div class="card-body">
									<div class="row">
									<div class="col-md-12">
							<div data-ng-if="responseObject.errorMessage != null"
								class="text-danger">
								<strong>Error!</strong>
								<p>{{responseObject.errorMessage}}</p>
							</div>
						</div>
										<div class="form-group col-sm-3">
											<label><span th:text="#{bankName}">Bank Name
													Name</span><span class="aestrick">&#42;</span></label>
													
											<input type="hidden"
												class="form-control" id="bankName"
												required="required"
												data-ng-model="bankData.bankId"
												name="bankId" />		
													 
											<input type="text"
												class="form-control" id="bankName"
												required="required"
												data-ng-model="bankData.bankName"
												name="bankName" maxlength="100" />
											<div data-ng-show="bankForm.$submitted">
												<p class="help-block" style="color: red;"
													data-ng-show="bankForm.bankName.$error.required">
													<span th:text="#{pleaseEnter}">Please enter</span> <span
														th:text="#{bankName}">Bank Name</span>
												</p>
											</div>
										</div>

									</div>
									
									
									<!--/.row-->
								</div>
								
								
							</div>
							<div class="card-footer text-right">
								<button type="submit" class="btn btn-sm btn-primary">
									<span th:text="#{submit}">Submit</span>
								</button>
								<!-- <button type="reset" class="btn btn-sm btn-danger">Reset</button> -->
							</div>
						</form>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>
	</div>
	<!-- /.container-fluid -->
</div>
</html>
