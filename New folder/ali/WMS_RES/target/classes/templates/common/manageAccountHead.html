<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>

<script type="text/javascript">

function updateAccountHead(id) {
	angular.element("#dynamic-table").scope().loadUpdateAccountHead(id);
};	

</script>


<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchAccountHeadList() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							"bDestroy": true,
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'User_data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4, 5, 6 ]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								 
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								$('td:eq(2)', nRow).html('<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="Edit"  href="javascript:void(0)" onclick="updateAccountHead('+aData.accountHeadId+')"> <i class="fa fa-pencil"></i></a>');
							},
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								/* $('td:eq(0)', nRow)
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : ""
							},
							"sAjaxSource" : "fetchAccountHeadList",

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							}, 
							{
								"data" : "accountHeadNameE"
							},
							{
								"data" : null,
								"bSortable" : false
							} ],

						});
	}
	
	function deleteUser(id) {

		/* return angular.element(document.getElementById('CommonController')).scope()
				.deleteInward(id); */
			return $('#page-div').scope().deleteUser(id);
	}
	function reDraw() {
		t.draw();
	}

	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	/* $('#applyFilters').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
		$('#searchForm').submit();
	}); */
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});

	/*]]>*/
</script>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span th:text="#{accountHead}"> Account Head 
				 </span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadAccountHeadList()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span
								th:text="#{accountHead}">Account Heads</span>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
							<div class="pr">
								<!-- <a class="btn btn-secondary btn-add" href="#addUserForm">
									<span th:text="#{addUser}">Add User</span>
								</a> -->
								 
							</div>
							<div class="table-responsive">
								<table id="dynamic-table"
									class="table table-striped table-bordered table-hover table-outline">
									<thead class="thead-default">
										<tr>
											<th><span>#</span></th>
											<th><span th:text="#{name}">Name</span></th>
											<th width="8%"><span th:text="#{action}">Action</span></th>
										</tr>
									</thead>
								</table>
								
								
								<form  name="form" data-ng-submit="addAccountHead(form, form.$valid)"
									  data-ng-init="" novalidate="novalidate">
								
							<div class="card-header">
								<span th:text="#{Add_New_Account_Head}">Add New Account Head </span>
							</div>
								
							<div class="row">
								<div class="form-group col-sm-6">
										<label><span th:text="#{accountHead}">AccountHead</span><span
											class="aestrick">&#42;</span></label> <input type="text"
											class="form-control" id="accountHead" required="required"
											data-ng-model="accountHeadBean.accountHeadNameE" name="accountHead" maxlength="90" />
										<div data-ng-show="form.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="form.accountHead.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													th:text="#{accountHead}">accountHead</span>
											</p>
										</div>
							   	</div>
								
									<div class="form-group col-sm-6">
									</div>
								
							</div>	
							
							<div class="row">
								
									<div class="form-group col-sm-6">
											
									 <button type="submit" class="btn btn-sm btn-primary"  >
										<span th:text="#{Add_New_Account_Head}">Add New Account head </span>
								   </button>
								
									</div>
									
									<div class="form-group col-sm-6">
										 
							   	</div>
								
							</div>
							
					</form>
					
					
					
		<div class="modal fade popup-lg" tabindex="-1" role="dialog"
			aria-labelledby="myLargeModalLabel" aria-hidden="true"
			id="accountHead-update-popup">
			<div class="modal-dialog modal-lg modal-map" style="max-width:50%;margin-top:15%;">
				<div class="modal-content">
					<div class="modal-header">
						<h6 class="modal-title">
							<span>Update Account Head </span>
						</h6>
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="col-md-12" style="margin-top:20px;">
						<form data-ng-submit="updateAccountHead(form, form.$valid)"
							name="form" novalidate="novalidate">
							<input type="hidden" id="id" data-ng-model="accountHeadBean.id" name="id"/>
							<div class="row">							
								<div class="form-group col-sm-6">
									<label><span>Account Head</span> <span class="aestrick">&#42;</span></label> 
									<input class="form-control" required="required" id="accountHead"
										data-ng-model="accountHeadBean.accountHeadNameE"
										name="accountHead" type="text" maxlength="90" />
									<div data-ng-show="form.$submitted">
										<p class="help-block" style="color: red;"
											data-ng-show="form.accountHead.$error.required">
											<span th:text="#{pleaseEnter}">Please enter</span> <span th:text="#{accountHead}"> Account Head.</span>
										</p>
									</div>
								</div>		
								 	<div class="form-group col-sm-6"> </div>
								<div class="form-group col-sm-12">
									<div class="text-right">
										 
										<button type="submit" class="btn btn-sm btn-success">
											<span th:text="#{submit}">Submit</span>
										</button>												
									</div>	
								</div>
							</div>
						</form>
					</div>					
				</div>
			</div>
		</div>
					
								
								
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
