<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>

<script th:src="@{/js/datepicker/jquery.ui.datepicker.js}"></script>
<script th:src="@{/js/datepicker/jquery-ui.min.js}"></script>

<link th:href="@{/css/datepicker/jquery.ui.datepicker.css}" rel="stylesheet" />
<link th:href="@{/css/datepicker/jquery-ui.min.css}" rel="stylesheet" />

<script th:src="@{/js/jquery-2.2.3.min.js}"></script>
	 	<script th:src="@{/js/jquery-gmaps-latlon-picker.js}"></script>
	
</head>

<script type="text/javascript">
	


	$(function() {
		$('#datetimepicker1').datetimepicker({
			//viewMode : 'days',
			maxDate : moment(),
			//useCurrent: false,
			format : 'DD/MM/YYYY'
			//useCurrent : false
		});
	
	});
</script>
<div>
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		
		
		<li class="breadcrumb-item active"><span th:text="#{sor_definition}">  SoR Definition </span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="#" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span th:text="#{sor_definition}">SoR Definition</span>
						</div>
						<div class="col-md-12">
							<div data-ng-if="responseObject.errorMessage != null"
								class="text-danger">
								<strong>Error!</strong>
								<p>{{responseObject.errorMessage}}</p>
							</div>
						</div>
						
						<div class="col-md-12">
							<div data-ng-if="errorMessage1 != null"	class="text-danger">
								<strong>Error!</strong>
								<p>{{errorMessage1}}</p>
							</div>
						</div>
						<form data-ng-submit="addSOR(sorForm, sorForm.$valid)"	name="sorForm" data-ng-init="" novalidate="novalidate">
							<!-- <div class="card-header">
								<span th:text="#{contractor}">Contractor</span>
							</div> -->
							 
							 
							<div class="card-body">
								<div class="row">
									<div class="form-group col-sm-4">
									
										<label><span th:text="#{sor_reference_name}">SoR Reference Name</span>
										<!-- <span class="aestrick">&#42;</span> -->
										</label> 
											
											<input required="required" type="text" class="form-control" 
													id="amount"   
													data-ng-model="sorBean.referenceName" name="referenceName"
													maxlength="90" />				
										
											 <div data-ng-show="sorForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sorForm..referenceName.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													th:text="#{reference_name}">referenceName</span>
											</p>
										</div>
										
									</div>
									
									
									 <div class="form-group col-sm-4">
									
										<label><span th:text="#{year}">Year</span><!-- <span
											class="aestrick">&#42;</span> --></label> 
											<select  required="required" class="form-control" data-ng-init="loadYears()" data-ng-model="sorBean.year" name="year" id="year">
												<option value="">--Select--</option>
												<option data-ng-repeat="year in years" value="{{year.id}}">{{year.year}}</option>
											</select>

										<div data-ng-show="sorForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sorForm.year.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													th:text="#{year}">year</span>
											</p>
										</div>
									</div>
									 
									  <div class="form-group col-sm-4">
									
										<label><span th:text="#{date_of_adoption}">Date of Adoption</span>
										<!-- <span class="aestrick">&#42;</span> -->
										</label> 
											<div class="input-group date" id="datetimepicker1"
												data-target-input="nearest">
												<input type="text" class="form-control datetimepicker-input"
													data-target="#datetimepicker1" 
													required="required" placeholder="DD/MM/YYYY"
													data-ng-model="sorBean.dateOfAdoption" name="dateOfAdoption"
													id="startingDate" autocomplete="off"  />
													<!--  data-ng-change="validateStartingDate();validateSubAcctStartingDate();" 
													ye wali line upar autocomplete ke baad aayegi
													-->
													
												<div class="input-group-append input-group-addon"
													data-target="#datetimepicker1" data-toggle="datetimepicker">
													<div class="input-group-text">
														<i class="fa fa-calendar"></i>
													</div>
												</div>
											</div>
										
										 <div data-ng-show="sorForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sorForm.dateOfAdoption.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													th:text="#{date_of_adoption}">date_of_adoption</span>
											</p>
										</div>
									</div>
									 
								</div>
					
					
						<div class="row">
									<div class="form-group col-sm-4">
									
										<label><span th:text="#{status}">Status</span>
										<!-- <span class="aestrick">&#42;</span> -->
										</label> 
											
											<select required="required"	class="form-control" data-ng-init="loadStatus()" data-ng-model="sorBean.status" name="status" id="status">
												<option value="">--Select--</option>
												<option data-ng-repeat="status in statuses" value="{{status.id}}">{{status.statusName}}</option>
											</select>
															
										
										 <div data-ng-show="sorForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sorForm.status.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													th:text="#{status}">status</span>
											</p>
										</div>
									</div>
									
								</div>
					
					<div class="row">
									<div class="form-group col-sm-4">
									
										<label><span th:text="#{remarks}">Remarks</span> 
										<!-- <span class="aestrick">&#42;</span> -->
										</label> 
											<textarea rows="4" cols="100" class="form-control-textarea" data-ng-model="sorBean.remarks" name="remarks"></textarea>
									</div>
									 
					</div>
						 
							</div>
							
						<div class="card-footer text-right">
								
								<button type="submit" class="btn btn-sm btn-primary" data-ng-click="submit=true" > 
									<span th:text="#{submit}">Submit</span>
								</button>
								
								<button type="button" class="btn btn-sm btn-primary" data-ng-click="doTheBack()" > 
									<span th:text="#{Cancel}">Cancel</span>
								</button>
					</div>
							
						
						</form>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>
	</div>
	<!-- /.container-fluid -->
</div>
</html>
